<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock C&amp;P Examination — Mental Disorders / PTSD-MST</title>
<style>
  @page { size: Letter; margin: 0.7in 0.7in 0.8in 0.7in; }
  :root {
    --ink: #1d232b; --muted: #55606e; --rule: #cfd6de; --navy: #1f3a5f;
    --navy-soft: #e8eef6; --amber: #8a5a00; --amber-soft: #fdf3e1;
    --red: #9b1c1c; --red-soft: #fbeaea; --green: #1d6b3a; --green-soft: #e7f4ec;
    --grey-soft: #f3f5f7;
  }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: "DejaVu Serif", Georgia, serif; color: var(--ink); font-size: 10.2pt; line-height: 1.42; margin: 0; background: #fff; }
  h1, h2, h3, h4, .sans { font-family: "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  h1 { font-size: 21pt; color: var(--navy); margin: 0 0 6pt; line-height: 1.15; }
  h2 { break-inside: avoid; font-size: 15pt; color: var(--navy); border-bottom: 2px solid var(--navy); padding-bottom: 3pt; margin: 18pt 0 8pt; break-after: avoid; }
  h3 { font-size: 11.6pt; color: var(--navy); margin: 13pt 0 5pt; break-after: avoid; }
  h4 { font-size: 10.2pt; margin: 9pt 0 3pt; break-after: avoid; }
  p { margin: 0 0 6pt; }
  ul, ol { margin: 0 0 6pt; padding-left: 17pt; }
  li { margin: 0 0 2.5pt; }
  table { border-collapse: collapse; width: 100%; margin: 4pt 0 9pt; font-size: 9pt; break-inside: auto; }
  th, td { border: 1px solid var(--rule); padding: 3.5pt 5pt; vertical-align: top; text-align: left; }
  th { background: var(--navy-soft); font-family: "DejaVu Sans", Arial, sans-serif; font-size: 8.6pt; }
  tr { break-inside: avoid; }
  .part { break-before: page; }
  .part-title { background: var(--navy); color: #fff; padding: 12pt 14pt; margin: 0 0 10pt; }
  .part-title h1 { color: #fff; margin: 0; font-size: 18pt; }
  .part-title p { margin: 3pt 0 0; font-family: "DejaVu Sans", Arial, sans-serif; font-size: 9.4pt; opacity: .9; }
  .callout { border-left: 4px solid var(--navy); background: var(--navy-soft); padding: 7pt 10pt; margin: 6pt 0 10pt; break-inside: avoid; }
  .warn { border-left-color: var(--amber); background: var(--amber-soft); }
  .stop { border-left-color: var(--red); background: var(--red-soft); }
  .ok { border-left-color: var(--green); background: var(--green-soft); }
  .callout > :last-child { margin-bottom: 0; }
  .label { font-family: "DejaVu Sans", Arial, sans-serif; font-weight: bold; font-size: 8.4pt; letter-spacing: .04em; text-transform: uppercase; display: block; margin-bottom: 2pt; }
  .small { font-size: 8.8pt; color: var(--muted); }
  .muted { color: var(--muted); }
  .fill { display: inline-block; min-width: 1.4in; border-bottom: 1px solid var(--ink); }
  .cite { font-size: 8.4pt; color: var(--muted); }

  /* Question blocks */
  .q { border: 1px solid var(--rule); border-radius: 3pt; margin: 0 0 8pt; break-inside: avoid; }
  .qh { background: var(--grey-soft); padding: 5pt 8pt; font-family: "DejaVu Sans", Arial, sans-serif; font-size: 9.5pt; font-weight: bold; border-bottom: 1px solid var(--rule); }
  .qn { display: inline-block; background: var(--navy); color: #fff; border-radius: 2pt; padding: 0 4pt; margin-right: 5pt; font-size: 8.4pt; }
  .qb { padding: 5pt 8pt 6pt; font-size: 9.3pt; }
  .qb p { margin: 0 0 3.5pt; }
  .qb .k { font-family: "DejaVu Sans", Arial, sans-serif; font-weight: bold; font-size: 8.2pt; text-transform: uppercase; letter-spacing: .03em; }
  .k.a { color: var(--navy); } .k.f { color: var(--amber); } .k.g { color: var(--green); } .k.t { color: var(--red); }
  .probe { font-style: italic; color: var(--muted); }
  .flag { display: inline-block; font-family: "DejaVu Sans", Arial, sans-serif; font-size: 7.4pt; font-weight: bold; padding: 0 4pt; border-radius: 2pt; vertical-align: 1pt; margin-left: 4pt; }
  .flag.hi { background: var(--red); color: #fff; }
  .flag.md { background: var(--amber); color: #fff; }

  /* Cover */
  .cover { height: 9.3in; display: flex; flex-direction: column; justify-content: space-between; }
  .cover .band { background: var(--navy); color: #fff; padding: 22pt 20pt; }
  .cover .band h1 { color: #fff; font-size: 26pt; margin-bottom: 6pt; }
  .cover .band p { font-family: "DejaVu Sans", Arial, sans-serif; margin: 0; font-size: 11pt; opacity: .92; }
  .meta { width: 100%; font-size: 9.6pt; }
  .meta td { border: none; border-bottom: 1px solid var(--rule); padding: 4pt 2pt; }
  .meta td:first-child { width: 2.1in; font-family: "DejaVu Sans", Arial, sans-serif; font-weight: bold; color: var(--navy); font-size: 8.8pt; }
  .toc ol { padding-left: 15pt; } .toc li { margin-bottom: 3pt; }

  /* Mock report */
  .report { border: 1.5px solid var(--ink); padding: 8pt 11pt; font-family: "DejaVu Sans Mono", "Courier New", monospace; font-size: 8.3pt; line-height: 1.38; margin: 6pt 0 10pt; }
  .report h4 { font-family: "DejaVu Sans Mono", monospace; font-size: 8.6pt; margin: 7pt 0 2pt; text-decoration: underline; }
  .report p { margin: 0 0 4pt; }
  .report .box { display: inline-block; width: 8pt; height: 8pt; border: 1px solid var(--ink); margin-right: 4pt; vertical-align: -1pt; }
  .report .box.x { background: var(--ink); }
  .ann { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 8.4pt; background: var(--amber-soft); border-left: 3px solid var(--amber); padding: 3pt 6pt; margin: 2pt 0 6pt; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8pt; }
  .rubric td:nth-child(n+2) { text-align: center; width: 0.55in; }
  .avoid { break-inside: avoid; }
</style>
</head>
<body>
